<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 104" role="img" aria-labelledby="title desc">
  <title id="title">Parallelogram architecture token</title>
  <desc id="desc">A reusable right-leaning parallelogram with a safe inset box for label content.</desc>
  <defs>
    <g id="parallelogram" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="18,0 224,0 206,104 0,104" fill="var(--token-fill, #ecfeff)"/>
      <rect id="parallelogram-content-box" x="18" y="12" width="188" height="80" fill="none" stroke="none" data-content-box="true"/>
    </g>
  </defs>
  <use href="#parallelogram"/>
</svg>
